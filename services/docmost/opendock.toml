schema_version = 1
service_id = "docmost"
display_name = "Docmost"
dependencies = ["infra"]

[setup]
dependencies = ["postgres"]
optional_config = ["mail"]

[[setup.fields]]
name = "DOCMOST_SUBDOMAIN"
kind = "defaulted-choice"
default = "docmost"

[[setup.fields]]
name = "DOCMOST_DB_PASSWORD"
kind = "generated-secret"

[[setup.fields]]
name = "DOCMOST_APP_SECRET"
kind = "generated-secret"

[removal]
# Uploaded files are stored in the Compose named volume and removed by Compose.
data_paths = []

[removal.shared_database]
shared_group = "postgres"
database_key = "DOCMOST_DB_NAME"
role_key = "DOCMOST_DB_USER"

[routing]
subdomain_key = "DOCMOST_SUBDOMAIN"
caddy_handler = "docmost_proxy"
