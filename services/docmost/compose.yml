services:
  docmost-db-init:
    image: postgres:${DOCMOST_POSTGRES_CLIENT_VERSION}
    networks:
      - shared-net
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      DOCMOST_DB_HOST: ${DOCMOST_DB_HOST}
      DOCMOST_DB_PORT: ${DOCMOST_DB_PORT}
      DOCMOST_DB_NAME: ${DOCMOST_DB_NAME}
      DOCMOST_DB_USER: ${DOCMOST_DB_USER}
      DOCMOST_DB_PASSWORD: ${DOCMOST_DB_PASSWORD}
    command: >
      sh -c '
        export PGPASSWORD="$${POSTGRES_ADMIN_PASSWORD}";
        attempts=0;
        until pg_isready -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -d postgres; do
          attempts=$$((attempts + 1));
          if [ "$$attempts" -ge 60 ]; then
            echo "PostgreSQL did not become ready after 120 seconds.";
            exit 1;
          fi;
          echo "Waiting for PostgreSQL...";
          sleep 2;
        done;
        if ! psql -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '\''$${DOCMOST_DB_USER}'\''" | grep -qx 1; then
          psql -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -d postgres -v ON_ERROR_STOP=1 -c "CREATE USER \"$${DOCMOST_DB_USER}\" WITH PASSWORD '\''$${DOCMOST_DB_PASSWORD}'\''";
        else
          psql -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -d postgres -v ON_ERROR_STOP=1 -c "ALTER USER \"$${DOCMOST_DB_USER}\" WITH PASSWORD '\''$${DOCMOST_DB_PASSWORD}'\''";
        fi;
        if ! psql -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '\''$${DOCMOST_DB_NAME}'\''" | grep -qx 1; then
          createdb -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -O "$${DOCMOST_DB_USER}" "$${DOCMOST_DB_NAME}";
        fi;
        psql -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE \"$${DOCMOST_DB_NAME}\" OWNER TO \"$${DOCMOST_DB_USER}\"";
        psql -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -d postgres -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE \"$${DOCMOST_DB_NAME}\" TO \"$${DOCMOST_DB_USER}\"";
        psql -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -d "$${DOCMOST_DB_NAME}" -v ON_ERROR_STOP=1 -c "ALTER SCHEMA public OWNER TO \"$${DOCMOST_DB_USER}\"";
        psql -h "$${DOCMOST_DB_HOST}" -p "$${DOCMOST_DB_PORT}" -U "$${POSTGRES_ADMIN_USER}" -d "$${DOCMOST_DB_NAME}" -v ON_ERROR_STOP=1 -c "GRANT ALL ON SCHEMA public TO \"$${DOCMOST_DB_USER}\"";
      '
    restart: "no"

  docmost:
    image: docmost/docmost:${DOCMOST_VERSION}
    container_name: ${DOCMOST_CONTAINER_NAME}
    depends_on:
      docmost-db-init:
        condition: service_completed_successfully
    networks:
      - shared-net
    volumes:
      - docmost_storage:/app/data/storage
    environment:
      APP_URL: https://${DOCMOST_SUBDOMAIN:-docmost}.${STACK_DOMAIN:-localhost}
      APP_SECRET: ${DOCMOST_APP_SECRET}
      DATABASE_URL: postgresql://${DOCMOST_DB_USER}:${DOCMOST_DB_PASSWORD}@${DOCMOST_DB_HOST}:${DOCMOST_DB_PORT}/${DOCMOST_DB_NAME}?schema=public
      REDIS_URL: ${DOCMOST_REDIS_URL}
      MAIL_DRIVER: smtp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${DOCMOST_MAIL_FROM_NAME}
      DISABLE_TELEMETRY: ${DOCMOST_DISABLE_TELEMETRY}
    restart: unless-stopped

networks:
  shared-net:
    external: true

volumes:
  docmost_storage:
