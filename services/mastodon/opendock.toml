schema_version = 1
service_id = "mastodon"
display_name = "Mastodon"
capability_api_version = 1
capabilities = ["plan_secrets", "generate_secrets", "validate_config", "post_launch"]
dependencies = ["infra"]

[setup]
dependencies = ["postgres"]
optional_config = ["mail"]

[[setup.fields]]
name = "MASTODON_SUBDOMAIN"
kind = "defaulted-choice"
default = "social"

[[setup.fields]]
name = "MASTODON_ADMIN_USERNAME"
kind = "defaulted-choice"
default = "opendock"
required = true

[[setup.fields]]
name = "MASTODON_ADMIN_EMAIL"
kind = "required-user"

[[setup.fields]]
name = "MASTODON_ADMIN_PASSWORD"
kind = "initial-credential"
note = "Used only when OpenDock creates the first Mastodon owner account."
change_notice = "Mastodon owner password is stored in services/mastodon/.env. It is used only when OpenDock creates the first Mastodon owner account."

[[setup.fields]]
name = "MASTODON_DB_PASSWORD"
kind = "generated-secret"

[[setup.fields]]
name = "MASTODON_SECRET_KEY_BASE"
kind = "generated-secret"
generator = "mastodon-rails"

[[setup.fields]]
name = "MASTODON_OTP_SECRET"
kind = "generated-secret"
generator = "mastodon-rails"

[[setup.fields]]
name = "MASTODON_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY"
kind = "generated-secret"
generator = "hex"
length = 32

[[setup.fields]]
name = "MASTODON_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT"
kind = "generated-secret"
generator = "hex"
length = 32

[[setup.fields]]
name = "MASTODON_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY"
kind = "generated-secret"
generator = "hex"
length = 32

[[setup.fields]]
name = "MASTODON_VAPID_PRIVATE_KEY"
kind = "generated-secret"
generator = "mastodon-vapid"

[[setup.fields]]
name = "MASTODON_VAPID_PUBLIC_KEY"
kind = "generated-secret"
generator = "mastodon-vapid"

[removal]
data_paths = ["data/public/system"]

[removal.shared_database]
shared_group = "postgres"
database_key = "MASTODON_DB_NAME"
role_key = "MASTODON_DB_USER"

[routing]
subdomain_key = "MASTODON_SUBDOMAIN"
caddy_handler = "mastodon_proxy"
