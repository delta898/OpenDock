schema_version = 1
service_id = "mattermost"
display_name = "Mattermost"
dependencies = ["infra"]

[setup]
dependencies = ["postgres"]
optional_config = ["mail"]

[[setup.fields]]
name = "MATTERMOST_SUBDOMAIN"
kind = "defaulted-choice"
default = "chat"

[[setup.fields]]
name = "MATTERMOST_DB_PASSWORD"
kind = "generated-secret"

[removal]
data_paths = []

[removal.shared_database]
shared_group = "postgres"
database_key = "MATTERMOST_DB_NAME"
role_key = "MATTERMOST_DB_USER"

[routing]
subdomain_key = "MATTERMOST_SUBDOMAIN"
caddy_handler = "mattermost_proxy"
