schema_version = 1
service_id = "immich"
display_name = "Immich"
dependencies = ["infra"]

[[setup.fields]]
name = "IMMICH_SUBDOMAIN"
kind = "defaulted-choice"
default = "photos"

[[setup.fields]]
name = "IMMICH_LIBRARY_PATH"
kind = "defaulted-choice"
default = "./data/library"
note = "Press Enter to keep ./data/library. For another location, enter an existing absolute host directory. PostgreSQL stays on local storage; OpenDock does not detect which disk this path is on."

[[setup.fields]]
name = "IMMICH_DB_PASSWORD"
kind = "generated-secret"
generator = "alphanumeric"
length = 48

[removal]
data_paths = ["data/library", "data/postgres"]

[routing]
subdomain_key = "IMMICH_SUBDOMAIN"
caddy_handler = "immich_proxy"

[[storage.mounts]]
name = "library"
setting_key = "IMMICH_LIBRARY_PATH"
container_path = "/data"
access = "read-write"
