schema_version = 1
service_id = "immich"
display_name = "Immich"
dependencies = ["infra"]

[[setup.fields]]
name = "IMMICH_SUBDOMAIN"
kind = "defaulted-choice"
default = "photos"

[[setup.fields]]
name = "IMMICH_DB_PASSWORD"
kind = "generated-secret"
generator = "alphanumeric"
length = 48

[removal]
data_paths = ["data/library", "data/postgres"]

[routing]
subdomain_key = "IMMICH_SUBDOMAIN"
caddy_handler = "immich_proxy"
