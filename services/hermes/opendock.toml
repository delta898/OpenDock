schema_version = 1
service_id = "hermes"
display_name = "Hermes Agent"
capability_api_version = 1
capabilities = ["runtime_environment", "prepare"]
dependencies = ["infra"]

[removal]
data_paths = ["data/sandboxes"]
extra_images = ["nousresearch/hermes-sandbox:desktop"]

[[removal.orphan_containers]]
label = "hermes-task-id"
path = "data/sandboxes"

[[setup.fields]]
name = "HERMES_SUBDOMAIN"
kind = "defaulted-choice"
default = "hermes"

[[setup.fields]]
name = "HERMES_DASHBOARD_USERNAME"
kind = "defaulted-choice"
default = "opendock"

[[setup.fields]]
name = "HERMES_DASHBOARD_PASSWORD"
kind = "secret-user"
note = "Used at runtime for Hermes dashboard login. The value is stored privately and is not displayed."
change_notice = "Hermes dashboard password is stored in private services/hermes/.env. Run './opendock launch hermes' to apply a changed password."

[[setup.fields]]
name = "HERMES_DASHBOARD_SECRET"
kind = "generated-secret"
generator = "alphanumeric"
length = 48
