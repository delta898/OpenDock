schema_version = 1
service_id = "homepage"
display_name = "Homepage"
dependencies = ["infra"]

[[setup.fields]]
name = "HOMEPAGE_SUBDOMAIN"
kind = "defaulted-choice"
default = "home"

[removal]
# The mounted dashboard configuration is tracked source and must be preserved.
data_paths = []

[routing]
subdomain_key = "HOMEPAGE_SUBDOMAIN"
caddy_handler = "homepage_proxy"
