schema_version = 1
service_id = "wordpress"
display_name = "WordPress"
dependencies = ["infra"]

[[commands]]
name = "multisite"
summary = "Convert WordPress to subdirectory multisite mode."
details = "Uses the configured WordPress hostname and asks for confirmation before changing WordPress configuration and database behavior. Reverting after creating sites or content requires a migration. Set YES=1 for automation."
examples = ["./opendock service wordpress multisite", "YES=1 ./opendock service wordpress multisite"]

[setup]
dependencies = ["mariadb"]

[[setup.fields]]
name = "WORDPRESS_SUBDOMAIN"
kind = "defaulted-choice"
default = "blog"

[[setup.fields]]
name = "WORDPRESS_WEBROOT_PATH"
kind = "defaulted-choice"
default = "./data/webroot"
note = "Press Enter to keep ./data/webroot. For another location, enter an existing absolute host directory for the complete WordPress webroot. OpenDock does not detect which disk it is on."

[[setup.fields]]
name = "WORDPRESS_DB_PASSWORD"
kind = "generated-secret"

[removal]
data_paths = ["data/webroot"]

[removal.shared_database]
shared_group = "mariadb"
database_key = "WORDPRESS_DB_NAME"
role_key = "WORDPRESS_DB_USER"

[routing]
subdomain_key = "WORDPRESS_SUBDOMAIN"
caddy_handler = "wordpress_proxy"

[[storage.mounts]]
name = "webroot"
setting_key = "WORDPRESS_WEBROOT_PATH"
container_path = "/var/www/html"
access = "read-write"
