_format_version: "2.1"
_transform: true

consumers:
  - username: DASHBOARD
  - username: anon
    keyauth_credentials:
      - key: "$SUPABASE_ANON_KEY"
      - key: "$SUPABASE_PUBLISHABLE_KEY"
  - username: service_role
    keyauth_credentials:
      - key: "$SUPABASE_SERVICE_KEY"
      - key: "$SUPABASE_SECRET_KEY"

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

basicauth_credentials:
  - consumer: DASHBOARD
    username: "$DASHBOARD_USERNAME"
    password: "$DASHBOARD_PASSWORD"

services:
  - name: auth-v1-open-verify
    url: http://supabase-auth:9999/verify
    routes:
      - name: auth-v1-open-verify
        strip_path: true
        paths: [/auth/v1/verify]
    plugins: [{name: cors}]

  - name: auth-v1-open-callback
    url: http://supabase-auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths: [/auth/v1/callback]
    plugins: [{name: cors}]

  - name: auth-v1-open-authorize
    url: http://supabase-auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths: [/auth/v1/authorize]
    plugins: [{name: cors}]

  - name: auth-v1-open-jwks
    url: http://supabase-auth:9999/.well-known/jwks.json
    routes:
      - name: auth-v1-open-jwks
        strip_path: true
        paths: [/auth/v1/.well-known/jwks.json]
    plugins: [{name: cors}]

  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths: [/auth/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config: {hide_credentials: false}
      - name: request-transformer
        config:
          add: {headers: ["Authorization: $LUA_AUTH_EXPR"]}
          replace: {headers: ["Authorization: $LUA_AUTH_EXPR"]}
      - name: acl
        config: {hide_groups_header: true, allow: [admin, anon]}

  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths: [/rest/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config: {hide_credentials: false}
      - name: request-transformer
        config:
          add: {headers: ["Authorization: $LUA_AUTH_EXPR"]}
          replace: {headers: ["Authorization: $LUA_AUTH_EXPR"]}
      - name: acl
        config: {hide_groups_header: true, allow: [admin, anon]}

  - name: graphql-v1
    url: http://supabase-rest:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths: [/graphql/v1]
    plugins:
      - name: cors
      - name: key-auth
        config: {hide_credentials: false}
      - name: request-transformer
        config:
          add:
            headers:
              - "Content-Profile: graphql_public"
              - "Authorization: $LUA_AUTH_EXPR"
          replace: {headers: ["Authorization: $LUA_AUTH_EXPR"]}
      - name: acl
        config: {hide_groups_header: true, allow: [admin, anon]}

  - name: realtime-v1
    url: http://realtime-dev.supabase-realtime:4000/socket
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths: [/realtime/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config: {hide_credentials: false}
      - name: request-transformer
        config:
          add: {headers: ["x-api-key: $LUA_RT_WS_EXPR"]}
          replace: {querystring: ["apikey: $LUA_RT_WS_EXPR"]}
      - name: acl
        config: {hide_groups_header: true, allow: [admin, anon]}

  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths: [/storage/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config: {hide_credentials: false}
      - name: request-transformer
        config:
          add: {headers: ["Authorization: $LUA_AUTH_EXPR"]}
          replace: {headers: ["Authorization: $LUA_AUTH_EXPR"]}
      - name: acl
        config: {hide_groups_header: true, allow: [admin, anon]}

  - name: functions-v1
    url: http://supabase-edge-runtime:9000/
    read_timeout: 150000
    routes:
      - name: functions-v1-all
        strip_path: true
        paths: [/functions/v1/]
    plugins: [{name: cors}]

  - name: meta
    url: http://supabase-pg-meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths: [/pg/]
    plugins:
      - name: basic-auth
        config: {hide_credentials: true}

  - name: studio
    url: http://supabase-studio:3000/
    routes:
      - name: studio-all
        strip_path: false
        paths: [/]
    plugins:
      - name: basic-auth
        config: {hide_credentials: true}
