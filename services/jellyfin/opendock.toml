dependencies = ["infra"]

[[setup.fields]]
name = "JELLYFIN_SUBDOMAIN"
kind = "defaulted-choice"
default = "media"

[removal]
data_paths = ["media"]
preserve_paths = [
  "media/movies/.gitkeep",
  "media/shows/.gitkeep",
  "media/music/.gitkeep",
]
