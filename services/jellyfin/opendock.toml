schema_version = 1
service_id = "jellyfin"
display_name = "Jellyfin"
dependencies = ["infra"]

[[setup.fields]]
name = "JELLYFIN_SUBDOMAIN"
kind = "defaulted-choice"
default = "media"

[[setup.fields]]
name = "JELLYFIN_MEDIA_PATH"
kind = "defaulted-choice"
default = "./media"
note = "Press Enter to keep ./media. For another location, enter an existing absolute host directory. OpenDock does not detect which disk it is on."

[removal]
data_paths = ["media"]
preserve_paths = [
  "media/movies/.gitkeep",
  "media/shows/.gitkeep",
  "media/music/.gitkeep",
]

[routing]
subdomain_key = "JELLYFIN_SUBDOMAIN"
caddy_handler = "jellyfin_proxy"

[[storage.mounts]]
name = "media"
setting_key = "JELLYFIN_MEDIA_PATH"
container_path = "/media"
access = "read-write"
