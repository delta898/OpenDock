schema_version = 1
section_id = "cloudflare"
config_file = "config/cloudflare.env"
setting_keys = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_TUNNEL_ID", "CLOUDFLARED_TUNNEL_TOKEN"]

[[setup.fields]]
name = "CLOUDFLARE_API_TOKEN"
kind = "secret-user"
required = true
note = "Create a custom token at https://dash.cloudflare.com/profile/api-tokens with Zone:Zone:Read, Zone:DNS:Edit, and Account:Cloudflare Tunnel:Edit. Select only the account and zones OpenDock will manage. Guide: README.md#cloudflare-tunnel."

[[setup.fields]]
name = "CLOUDFLARE_TUNNEL_ID"
kind = "required-user"
required = true
note = "In Cloudflare Dashboard, open Networking > Tunnels, select your remotely managed Tunnel, and copy its Tunnel ID. The connector token is separate. Guide: README.md#cloudflare-tunnel."
