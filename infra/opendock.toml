schema_version = 1
component_id = "infra"
config_file = "config/infra.env"
setting_keys = [
  "MARIADB_ROOT_PASSWORD",
  "POSTGRES_ADMIN_USER",
  "POSTGRES_ADMIN_PASSWORD",
  "MARIADB_VERSION",
  "POSTGRES_VERSION",
  "REDIS_VERSION",
]
shared_groups = ["mariadb", "postgres"]

[[shared_settings]]
name = "MARIADB_CLIENT_VERSION"
owner_file = "config/shared/database.env"
shared_group = "mariadb"

[[setup.fields]]
name = "MARIADB_ROOT_PASSWORD"
kind = "generated-secret"
generator = "url-safe"
length = 36
shared_group = "mariadb"

[[setup.fields]]
name = "POSTGRES_ADMIN_USER"
kind = "defaulted-choice"
default = "opendock"
shared_group = "postgres"

[[setup.fields]]
name = "POSTGRES_ADMIN_PASSWORD"
kind = "generated-secret"
generator = "url-safe"
length = 36
shared_group = "postgres"
